server {
    listen 80;
    server_name localhost;

    # Archivos estaticos de React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # El service worker nunca debe quedar cacheado por el navegador/proxy
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        root /usr/share/nginx/html;
    }

    # index.html tampoco: es el que apunta a los bundles de cada versión.
    # (try_files termina aquí para cualquier ruta de la SPA.)
    location = /index.html {
        add_header Cache-Control "no-cache";
        root /usr/share/nginx/html;
    }

    # Bundles con hash en el nombre: se pueden cachear sin límite
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        root /usr/share/nginx/html;
    }

    # Evidencia fotográfica servida por el backend
    location /uploads/ {
        proxy_pass http://backend:3042/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso al Backend (puerto interno 3042)
    location /api/ {
        proxy_pass http://backend:3042/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
